name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["**.md"]
  pull_request:
    paths-ignore: ["**.md"]
  workflow_dispatch:
    inputs:
      build:
        description: Build packages
        type: boolean
        default: true
      origins:
        description: Comma-separated package origins to build
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Pinned by digest: the upstream `latest` tag is mutable, so an unpinned
    # image could change lint results without a commit here.
    container: registry.alpinelinux.org/alpine/infra/docker/apkbuild-lint-tools:latest@sha256:6300f3fe1d222f85d358c462931a3dcded73a6b230e113a7ab7502933985a873
    steps:
      - name: Check out repository
        run: |
          apk add --no-cache git
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          cd "$GITHUB_WORKSPACE"
          git init --initial-branch=ci
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          git fetch --depth 1 origin "$HEAD_REF"
          git checkout --detach FETCH_HEAD
        env:
          HEAD_REF: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Lint APKBUILDs
        run: |
          # The image ships an aports-specific `lint` wrapper that depends on
          # GitLab merge-request variables, so drive the underlying checks
          # directly instead. Both tools need an explicit APKBUILD path:
          # `apkbuild-shellcheck` with no argument reads stdin, which is empty
          # here and would silently pass.
          . "$GITHUB_WORKSPACE/scripts/lib.sh"
          status=0
          for origin in $(all_origins); do
            printf '==> linting %s\n' "$origin"
            (
              cd "packages/$origin"
              abuild -f validate || exit 1
              apkbuild-shellcheck APKBUILD || exit 1
              apkbuild-lint APKBUILD || exit 1
            ) || status=1
          done
          exit "$status"

  test-updater:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      build: ${{ steps.scope.outputs.build }}
      origins: ${{ steps.scope.outputs.origins }}
      package_origins: ${{ steps.scope.outputs.package_origins }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - run: python3 -m unittest discover -s tests
      - name: Select build scope
        id: scope
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          BUILD_REQUESTED: ${{ inputs.build }}
          BUILD_ORIGINS: ${{ inputs.origins }}
        run: |
          . scripts/lib.sh
          all_origins_csv() {
            all_origins | paste -sd, -
          }
          files=
          version_base=
          build=false
          origins=
          package_origins=
          case "$GITHUB_EVENT_NAME" in
            pull_request)
              version_base=$PR_BASE_SHA
              files=$(git diff --name-only --no-renames \
                "$version_base...$PR_HEAD_SHA")
              ;;
            push)
              if [ "$PUSH_BEFORE" != 0000000000000000000000000000000000000000 ]; then
                version_base=$PUSH_BEFORE
                files=$(git diff --name-only --no-renames \
                  "$version_base...$GITHUB_SHA")
              fi
              ;;
            workflow_dispatch)
              case "$GITHUB_REF_NAME" in
                update/*)
                  version_base="origin/$DEFAULT_BRANCH"
                  files=$(git diff --name-only --no-renames \
                    "$version_base...$GITHUB_SHA")
                  ;;
                *)
                  if [ -n "$BUILD_ORIGINS" ]; then
                    origins=$BUILD_ORIGINS
                  elif [ "$BUILD_REQUESTED" != false ]; then
                    origins=$(all_origins_csv)
                  fi
                  ;;
              esac
              ;;
          esac
          if [ -n "$files" ]; then
            origins=$(printf '%s\n' "$files" | python3 scripts/repository.py scope | jq -r '.[]' | paste -sd, -)
            if printf '%s\n' "$files" | grep -Eq '^scripts/(lib|prepare-builder|test-package)\.sh$'; then
              origins=$(all_origins_csv)
            fi
          fi
          if [ -n "$origins" ]; then
            build=true
            for origin in $(split_origins "$origins"); do
              printf '%s\n' "$origin" | grep -Eq '^[A-Za-z0-9][A-Za-z0-9+._-]*$' || {
                echo "invalid package origin: $origin" >&2
                exit 1
              }
              test -f "packages/$origin/APKBUILD" || {
                echo "unknown package origin: $origin" >&2
                exit 1
              }
              if printf '%s\n' "$files" | grep -Eq "^packages/$origin/"; then
                package_origins="${package_origins:+$package_origins,}$origin"
              fi
            done
          else
            build=false
          fi
          {
            echo "build=$build"
            echo "origins=$origins"
            echo "package_origins=$package_origins"
            echo "version_base=$version_base"
          } >> "$GITHUB_OUTPUT"
      - name: Enforce package version semantics
        if: steps.scope.outputs.package_origins != ''
        env:
          VERSION_BASE: ${{ steps.scope.outputs.version_base }}
          PACKAGE_ORIGINS: ${{ steps.scope.outputs.package_origins }}
        run: |
          . scripts/lib.sh
          test -n "$VERSION_BASE"
          for origin in $(split_origins "$PACKAGE_ORIGINS"); do
            previous="$RUNNER_TEMP/$origin-APKBUILD"
            if git cat-file -e "$VERSION_BASE:packages/$origin/APKBUILD" 2>/dev/null; then
              git show "$VERSION_BASE:packages/$origin/APKBUILD" > "$previous"
              python3 scripts/repository.py verify-pkgrel \
                --previous "$previous" \
                --current "packages/$origin/APKBUILD"
            fi
          done

  build:
    needs: [lint, test-updater]
    if: needs.test-updater.outputs.build == 'true'
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    container: alpine:edge
    steps:
      - name: Check out repository
        run: |
          apk add git
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git init "$GITHUB_WORKSPACE"
          cd "$GITHUB_WORKSPACE"
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          git fetch origin "$GITHUB_REF"
          git checkout --detach FETCH_HEAD
      - name: Prepare builder
        run: |
          sh scripts/prepare-builder.sh "$GITHUB_WORKSPACE"
          su builder -c 'abuild-keygen -a -n'
          cp /home/builder/.config/abuild/*.rsa.pub /etc/apk/keys/
      - name: Build changed packages
        env:
          ORIGINS: ${{ needs.test-updater.outputs.origins }}
        run: |
          . scripts/lib.sh
          for origin in $(split_origins "$ORIGINS"); do
            test -f "packages/$origin/APKBUILD" || {
              echo "removing package $origin requires a repository migration" >&2
              exit 1
            }
            supports_arch "${{ matrix.arch }}" "packages/$origin/APKBUILD" || continue
            su builder -c "cd '$GITHUB_WORKSPACE/packages/$origin' && abuild -r"
          done
      - name: Verify replacement versions
        if: needs.test-updater.outputs.package_origins != ''
        env:
          PACKAGE_ORIGINS: ${{ needs.test-updater.outputs.package_origins }}
        run: |
          . scripts/lib.sh
          cp keys/apkbuilds.rsa.pub /etc/apk/keys/
          previous=/tmp/previous-index.tar.gz
          wget -q -T 15 -t 4 "https://angribot.github.io/apkbuilds/edge/${{ matrix.arch }}/APKINDEX.tar.gz" -O "$previous"
          apk verify "$previous"
          repository=/home/builder/.local/share/abuild/packages
          mkdir /tmp/new-packages
          find "$repository" -type f -name '*.apk' -exec cp {} /tmp/new-packages/ \;
          test -n "$(find /tmp/new-packages -name '*.apk' -print -quit)"
          apk index --no-warnings --quiet \
            --output /tmp/new-index.tar.gz \
            --rewrite-arch "${{ matrix.arch }}" \
            /tmp/new-packages/*.apk
          set -- --previous-index "$previous" --built-index /tmp/new-index.tar.gz
          selected=false
          for origin in $(split_origins "$PACKAGE_ORIGINS"); do
            supports_arch "${{ matrix.arch }}" "packages/$origin/APKBUILD" || continue
            selected=true
            set -- "$@" --origin "$origin"
          done
          [ "$selected" = true ] || exit 0
          python3 scripts/repository.py replacements "$@" > /tmp/replacements
          while IFS="$(printf '\t')" read -r package new old; do
            test "$(apk version -t "$new" "$old")" = ">" || {
              echo "$package must increase version: $old -> $new" >&2
              exit 1
            }
          done < /tmp/replacements
      - name: Install changed packages
        if: needs.test-updater.outputs.origins != ''
        env:
          ORIGINS: ${{ needs.test-updater.outputs.origins }}
        run: |
          . scripts/lib.sh
          repository=/home/builder/.local/share/abuild/packages
          mkdir /tmp/install-packages
          find "$repository" -type f -name '*.apk' -exec cp {} /tmp/install-packages/ \;
          test -n "$(find /tmp/install-packages -name '*.apk' -print -quit)" || exit 0
          set -- apk add --repository "$repository"
          for package in /tmp/install-packages/*.apk; do
            set -- "$@" "$package"
          done
          "$@"
          case ",${ORIGINS}," in
            *,gnupg,*)
              version=$(apkbuild_field pkgver packages/gnupg/APKBUILD)
              scripts/test-package.sh "$version"
              ;;
          esac
