name: CI

on:
  push:
    branches: [main]
    paths:
      - '**'
      - '!**.md'
      - 'packages/**'
  pull_request:
    paths:
      - '**'
      - '!**.md'
      - 'packages/**'
  workflow_dispatch:
    inputs:
      full:
        description: 'Build all package origins regardless of changes'
        type: boolean
        default: false
      revision:
        description: 'Main commit to publish incrementally'
        type: string
        default: ''
      base_revision:
        description: 'Base main commit for incremental planning'
        type: string
        default: ''
  schedule:
    - cron: '0 0 * * 0'

permissions:
  contents: read

# Publication mutates a single branch, so runs must not overlap on main.
# Cancelling superseded PR runs is safe because they publish nothing.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PAGES_URL: https://angribot.github.io/apkbuilds

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container: alpine:edge
    steps:
      - name: Install tools
        # The aports lint image requires registry authentication, so install
        # the same checks onto a plain alpine:edge instead.
        run: apk add --no-cache alpine-sdk atools-apkbuild-lint git python3 shellcheck
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.revision || github.sha }}
      - name: Trust the workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Create the builder user
        # `abuild` refuses to run as root, and the container's only user is
        # root. Reuse the build job's setup so both jobs get the same user.
        run: . scripts/prepare-builder.sh "$GITHUB_WORKSPACE"
      - name: Lint APKBUILDs
        run: |
          # Feed the script over stdin: nesting it inside `su -c '...'` would
          # need a second layer of quoting for every expansion.
          su builder -s /bin/sh <<'LINT'
          . scripts/lib.sh
          status=0
          for origin in $(all_origins); do
            assert_origin_directory "packages/$origin" || status=1
            printf '==> linting %s\n' "$origin"
            (
              cd "packages/$origin"
              abuild -f validate || exit 1
              # `apkbuild-shellcheck` is gone from Alpine; call shellcheck
              # directly. An APKBUILD is a sourced fragment, so the variables
              # and functions abuild supplies read as unassigned/unreachable,
              # and abuild runs each phase under `set -e`, so a bare `cd`
              # already aborts on failure.
              shellcheck --shell=ash --exclude=SC2034,SC2154,SC2164 APKBUILD || exit 1
              apkbuild-lint APKBUILD || exit 1
            ) || status=1
          done
          exit "$status"
          LINT
      - name: Run unit tests
        run: python3 -m unittest discover -s tests
      - name: Require a version increase for edited packages
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        # Publication skips a complete declared package family, so an edit
        # that forgets to bump pkgrel would never reach users.
        run: sh scripts/check-declared-build.sh

  plan:
    # Planning only reads the checkout, so it can overlap repository checks.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      has_origins: ${{ steps.set-matrix.outputs.has_origins }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.revision || github.sha }}
      - name: Compute changed origins
        id: set-matrix
        env:
          EVENT: ${{ github.event_name }}
          FULL: ${{ inputs.full || 'false' }}
          BASE: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
          REVISION: ${{ inputs.revision || github.sha }}
          BASE_REVISION: ${{ inputs.base_revision }}
          EXPLICIT_REVISION: ${{ inputs.revision != '' && 'true' || 'false' }}
          MAIN_REVISION: origin/${{ github.event.repository.default_branch }}
        run: sh scripts/plan-origins.sh

  build:
    needs: [check, plan]
    if: needs.plan.outputs.has_origins == 'true'
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.revision || github.sha }}
      - name: Restore source distfiles
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.cache/distfiles
          key: apkbuilds-distfiles-${{ matrix.arch }}-${{ matrix.origin }}-${{ hashFiles(format('packages/{0}/APKBUILD', matrix.origin)) }}
          restore-keys: apkbuilds-distfiles-${{ matrix.arch }}-${{ matrix.origin }}-
      # Restore the newest compatible snapshot, then save this build under a
      # unique key. GitHub Actions cache entries are immutable, so the save key
      # must never reuse the compatibility prefix itself.
      - name: Compute ccache cache keys
        id: ccache-key
        run: |
          echo "prefix=apkbuilds-ccache-${{ matrix.arch }}-${{ matrix.origin }}-${{ runner.os }}-" >> "$GITHUB_OUTPUT"
          echo "key=apkbuilds-ccache-${{ matrix.arch }}-${{ matrix.origin }}-${{ runner.os }}-${{ hashFiles(format('packages/{0}/**', matrix.origin)) }}-${{ github.run_id }}-${{ github.run_attempt }}" >> "$GITHUB_OUTPUT"
      - name: Restore ccache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.cache/ccache-${{ matrix.origin }}
          key: ${{ steps.ccache-key.outputs.key }}
          restore-keys: ${{ steps.ccache-key.outputs.prefix }}
      - name: Build packages missing from the published APK repository
        env:
          ARCH: ${{ matrix.arch }}
          ORIGIN: ${{ matrix.origin }}
          BRANCH: ${{ github.ref_name }}
        run: |
          mkdir -p "$RUNNER_TEMP/new"
          mkdir -p .cache/distfiles .cache/ccache-${{ matrix.origin }}
          # An ephemeral key signs these packages: this job runs upstream
          # build scripts, so it must never see the repository signing key.
          docker run --rm \
            -e ARCH \
            -e ORIGIN \
            -e BRANCH \
            -e PUBLISHED="$PAGES_URL/edge/${{ matrix.arch }}" \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -v "$GITHUB_WORKSPACE/keys/apkbuilds.rsa.pub:/keys/apkbuilds.rsa.pub:ro" \
            -v "$RUNNER_TEMP/new:/new" \
            -v "$GITHUB_WORKSPACE/.cache/distfiles:/var/cache/distfiles" \
            -v "$GITHUB_WORKSPACE/.cache/ccache-${{ matrix.origin }}:/home/builder/.cache/ccache" \
            -w /workspace \
            alpine:edge sh -euxc '
              sh scripts/prepare-builder.sh /new /workspace
              . scripts/lib.sh

              # Published package families are trusted only after their index
              # is verified with the repository signing key.
              cp /keys/apkbuilds.rsa.pub /etc/apk/keys/
              mkdir -p /tmp/published
              wget -q -T 15 -t 2 \
                -O /tmp/published/APKINDEX.tar.gz \
                "$PUBLISHED/APKINDEX.tar.gz"
              apk verify /tmp/published/APKINDEX.tar.gz
              tar -xOzf /tmp/published/APKINDEX.tar.gz APKINDEX \
                > /tmp/published/APKINDEX

              su builder -c "abuild-keygen -a -n"
              cp /home/builder/.config/abuild/*.rsa.pub /etc/apk/keys/

              supports_arch "$ARCH" "packages/$ORIGIN/APKBUILD" || exit 0
              assert_origin_directory "packages/$ORIGIN"
              expected="/tmp/expected-$ORIGIN"
              published="/tmp/published-$ORIGIN"
              su builder -c \
                "cd /workspace/packages/$ORIGIN && abuild listpkg" \
                > "$expected"
              apkindex_origin_apks \
                /tmp/published/APKINDEX "$ORIGIN" > "$published"
              if package_sets_equal "$expected" "$published"; then
                published_apks="/tmp/published/$ORIGIN"
                mkdir -p "$published_apks"
                while IFS= read -r package; do
                  downloaded="$published_apks/$package"
                  wget -q -T 15 -t 2 -O "$downloaded" \
                    "$PUBLISHED/$package"
                  apk verify "$downloaded"
                done < "$expected"
                printf "==> %s package family already published\n" "$ORIGIN"
                exit 0
              fi

              declared=$(apkbuild_field pkgver "packages/$ORIGIN/APKBUILD")-r$(
                apkbuild_field pkgrel "packages/$ORIGIN/APKBUILD"
              )
              versions="/tmp/published-versions-$ORIGIN"
              apkindex_origin_versions \
                /tmp/published/APKINDEX "$ORIGIN" > "$versions"
              if grep -Fx "$declared" "$versions" >/dev/null; then
                printf "%s %s already published with a different package set\n" \
                  "$ORIGIN" "$declared" >&2
                exit 1
              fi

              su builder -c \
                "cd /workspace/packages/$ORIGIN && REPODEST=\"/new/$ORIGIN\" abuild -r"
              built="/new/$ORIGIN/packages/$ARCH"
              actual="/tmp/actual-$ORIGIN"
              find "$built" -maxdepth 1 -type f -name "*.apk" \
                -exec basename {} \; > "$actual"
              if ! package_sets_equal "$expected" "$actual"; then
                printf "%s build produced an incomplete package family\n" \
                  "$ORIGIN" >&2
                diff -u "$expected" "$actual" >&2 || true
                exit 1
              fi

              # Installation and package-specific smoke tests happen before
              # this family becomes a publication candidate.
              set -- apk add --allow-untrusted --repository "$built"
              for package in "$built"/*.apk; do set -- "$@" "$package"; done
              "$@"
              if [ "$ORIGIN" = gnupg ]; then
                scripts/test-package.sh \
                  "$(apkbuild_field pkgver packages/gnupg/APKBUILD)"
              fi
              if [ "$ORIGIN" = orbien ]; then
                scripts/test-orbien.sh
              fi
              if [ "$ORIGIN" = ports-box ]; then
                scripts/test-ports-box-service.sh
              fi
              if [ "$ORIGIN" = realm ]; then
                scripts/test-realm-service.sh
              fi
              if [ "$ORIGIN" = tirith ]; then
                scripts/test-tirith.sh \
                  "$(apkbuild_field pkgver packages/tirith/APKBUILD)"
              fi
              candidate="/new/built/$ARCH/$ORIGIN"
              mkdir -p "$candidate"
              cp "$built"/*.apk "$candidate/"
            '
      - name: Save distfiles cache
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.cache/distfiles
          key: apkbuilds-distfiles-${{ matrix.arch }}-${{ matrix.origin }}-${{ hashFiles(format('packages/{0}/APKBUILD', matrix.origin)) }}
      - name: Save ccache
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.cache/ccache-${{ matrix.origin }}
          key: ${{ steps.ccache-key.outputs.key }}
      - name: Stage the built packages
        id: stage
        run: |
          built="$RUNNER_TEMP/new/built/${{ matrix.arch }}/${{ matrix.origin }}"
          if [ -n "$(find "$built" -name '*.apk' -print -quit 2>/dev/null)" ]; then
            echo 'built=true' >> "$GITHUB_OUTPUT"
          else
            echo 'built=false' >> "$GITHUB_OUTPUT"
            echo "no new packages for ${{ matrix.arch }} ${{ matrix.origin }}"
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: steps.stage.outputs.built == 'true'
        with:
          name: built-${{ matrix.arch }}-${{ matrix.origin }}
          # Keep the architecture directory inside each artifact. Downloads
          # can then merge one or many artifacts into the same stable layout.
          path: ${{ runner.temp }}/new/built/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  sign:
    needs: build
    if: github.ref_name == github.event.repository.default_branch
    outputs:
      snapshot_created: ${{ steps.merge.outputs.merged }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.revision || github.sha }}
      - name: Check out the published APK repository
        run: |
          git clone --depth 1 --branch gh-pages \
            "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" "$RUNNER_TEMP/pages"
      - name: Download the built packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: built-*
          path: ${{ runner.temp }}/built
          merge-multiple: true
      - name: Find candidate package families
        id: merge
        run: |
          if [ -n "$(find "$RUNNER_TEMP/built" -type f -name '*.apk' -print -quit 2>/dev/null)" ]; then
            echo 'merged=true' >> "$GITHUB_OUTPUT"
          else
            echo 'merged=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Prepare an isolated signer
        if: steps.merge.outputs.merged == 'true'
        run: |
          docker build --tag apkbuilds-signer - <<'EOF'
          FROM alpine:edge
          RUN apk add --no-cache abuild
          EOF
      - name: Validate and merge candidate package families
        if: steps.merge.outputs.merged == 'true'
        run: |
          # Candidate APKs remain untrusted here. Validate them and the signed
          # baseline before the repository signing key enters any container.
          docker run --rm --network none \
            -v "$RUNNER_TEMP/pages:/pages" \
            -v "$RUNNER_TEMP/built:/built:ro" \
            -v "$GITHUB_WORKSPACE:/workspace:ro" \
            -v "$GITHUB_WORKSPACE/keys/apkbuilds.rsa.pub:/keys/apkbuilds.rsa.pub:ro" \
            apkbuilds-signer \
              /workspace/scripts/merge-package-families.sh \
              /pages /built /workspace /keys/apkbuilds.rsa.pub
      - name: Sign the APK repository without network access
        if: steps.merge.outputs.merged == 'true'
        env:
          ABUILD_PRIVATE_KEY: ${{ secrets.ABUILD_PRIVATE_KEY }}
        run: |
          # --network none keeps the repository signing key away from anything
          # that could exfiltrate it. Signing is architecture-independent, so
          # one runner signs both trees.
          docker run --rm --network none \
            -e ABUILD_PRIVATE_KEY \
            -v "$RUNNER_TEMP/pages:/pages" \
            -v "$GITHUB_WORKSPACE/keys/apkbuilds.rsa.pub:/keys/apkbuilds.rsa.pub:ro" \
            apkbuilds-signer sh -euxc '
              umask 077
              set +x
              printf "%s\n" "$ABUILD_PRIVATE_KEY" > /tmp/apkbuilds.rsa
              unset ABUILD_PRIVATE_KEY
              set -x
              trap "rm -f /tmp/apkbuilds.rsa" EXIT
              cp /keys/apkbuilds.rsa.pub /etc/apk/keys/
              for arch in x86_64 aarch64; do
                apk_repository="/pages/edge/$arch"
                test -d "$apk_repository" || continue
                for package in "$apk_repository"/*.apk; do
                  # Already-published packages carry a valid signature.
                  apk verify "$package" && continue
                  work=$(mktemp -d)
                  (
                    cd "$work"
                    abuild-gzsplit < "$package"
                    abuild-sign -q -t RSA256 \
                      -k /tmp/apkbuilds.rsa \
                      -p /keys/apkbuilds.rsa.pub \
                      control.tar.gz
                    cat control.tar.gz data.tar.gz > "$package"
                  )
                  rm -rf "$work"
                done
                cd "$apk_repository"
                rm -f APKINDEX.tar.gz Packages.adb
                apk index --no-warnings --quiet \
                  --output APKINDEX.tar.gz \
                  --rewrite-arch "$arch" \
                  ./*.apk
                abuild-sign -q -t RSA256 \
                  -k /tmp/apkbuilds.rsa \
                  -p /keys/apkbuilds.rsa.pub \
                  APKINDEX.tar.gz
              done
            '
      - name: Verify the APK repository without the private key
        if: steps.merge.outputs.merged == 'true'
        run: |
          docker run --rm --network none \
            -v "$RUNNER_TEMP/pages:/pages:ro" \
            -v "$GITHUB_WORKSPACE/scripts/lib.sh:/scripts/lib.sh:ro" \
            -v "$GITHUB_WORKSPACE/keys/apkbuilds.rsa.pub:/keys/apkbuilds.rsa.pub:ro" \
            alpine:edge sh -euxc '
              . /scripts/lib.sh
              cp /keys/apkbuilds.rsa.pub /etc/apk/keys/
              for arch in x86_64 aarch64; do
                apk_repository="/pages/edge/$arch"
                test -d "$apk_repository" || continue
                apk verify "$apk_repository/APKINDEX.tar.gz"
                apk verify "$apk_repository"/*.apk
                work=$(mktemp -d)
                tar -xOzf "$apk_repository/APKINDEX.tar.gz" APKINDEX \
                  > "$work/APKINDEX"
                apkindex_apks "$work/APKINDEX" > "$work/indexed"
                find "$apk_repository" -maxdepth 1 -type f -name "*.apk" \
                  -exec basename {} \; > "$work/physical"
                package_sets_equal "$work/indexed" "$work/physical"
                rm -rf "$work"
              done
            '
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: steps.merge.outputs.merged == 'true'
        with:
          name: signed-repository
          # include-hidden-files is needed for .nojekyll, which also drags in
          # the clone's .git; publish builds its own orphan commit and would
          # fail on surviving Git metadata.
          path: |
            ${{ runner.temp }}/pages/
            !${{ runner.temp }}/pages/.git
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  verify:
    needs: sign
    if: needs.sign.outputs.snapshot_created == 'true'
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.revision || github.sha }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: signed-repository
          path: ${{ runner.temp }}/pages
      - name: Install every declared build from the staged snapshot
        run: |
          docker run --rm \
            -v "$RUNNER_TEMP/pages:/pages:ro" \
            -v "$GITHUB_WORKSPACE:/workspace:ro" \
            -w /workspace \
            alpine:edge sh -euxc '
              . scripts/lib.sh
              cp /pages/apkbuilds.rsa.pub \
                /etc/apk/keys/apkbuilds.rsa.pub
              echo "/pages/edge" >> /etc/apk/repositories
              set -- apk add
              for origin in $(all_origins); do
                supports_arch "${{ matrix.arch }}" \
                  "packages/$origin/APKBUILD" || continue
                set -- "$@" "$(apkbuild_pinned_spec "packages/$origin")"
              done
              for delay in 0 5 10 20 40 60; do
                sleep "$delay"
                apk update && "$@" && exit 0
              done
              exit 1
            '

  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: signed-repository
          path: pages
      - name: Push the APK repository to gh-pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd pages
          # The artifact comes from a clone, so drop any Git metadata
          # that survived upload before building the orphan commit.
          rm -rf .git
          git init -q --initial-branch=gh-pages
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git remote add origin \
            "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git"
          git add -A
          # A single orphan commit keeps the branch from accumulating the
          # history of every .apk ever published.
          git commit -q -m "Publish $GITHUB_SHA"
          git push -q --force origin gh-pages
