name: Publish

on:
  workflow_dispatch:
    inputs:
      bootstrap:
        description: Create repository without a verified published baseline
        type: boolean
        default: false
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  actions: read
  contents: read

env:
  HEAD_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

concurrency:
  group: publish

jobs:
  scope:
    if: >-
      (github.event_name == 'workflow_dispatch' &&
      github.ref_name == github.event.repository.default_branch &&
      inputs.bootstrap == true) ||
      (github.event_name == 'workflow_run' &&
      (github.event.workflow_run.event == 'push' ||
      github.event.workflow_run.event == 'workflow_dispatch') &&
      github.event.workflow_run.head_sha == github.sha)
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.changes.outputs.publish }}
      x86_64_publish: ${{ steps.changes.outputs.x86_64_publish }}
      x86_64_origins: ${{ steps.changes.outputs.x86_64_origins }}
      aarch64_publish: ${{ steps.changes.outputs.aarch64_publish }}
      aarch64_origins: ${{ steps.changes.outputs.aarch64_origins }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.HEAD_SHA }}
          fetch-depth: 0
      - name: Select publication scope
        id: changes
        env:
          BOOTSTRAP: ${{ inputs.bootstrap }}
          HEAD_SHA: ${{ env.HEAD_SHA }}
          GH_TOKEN: ${{ github.token }}
        run: |
          x86_64_build_allowed=true
          aarch64_build_allowed=true
          if [ "$GITHUB_EVENT_NAME" = workflow_run ]; then
            jobs=$(gh api --paginate \
              "repos/$GITHUB_REPOSITORY/actions/runs/${{ github.event.workflow_run.id }}/jobs" \
              --jq '.jobs[] | [.name, .conclusion] | @tsv')
            printf '%s\n' "$jobs" | grep -Fqx $'test-updater\tsuccess' || {
              echo 'CI updater checks failed' >&2
              exit 1
            }
            build_jobs=$(printf '%s\n' "$jobs" | grep -E '^build \(' || true)
            if [ -z "$build_jobs" ]; then
              x86_64_build_allowed=false
              aarch64_build_allowed=false
            else
              x86_64_build_allowed=false
              aarch64_build_allowed=false
              printf '%s\n' "$build_jobs" | grep -Eq $'^build \\(x86_64,.*\tsuccess$' &&
                x86_64_build_allowed=true
              printf '%s\n' "$build_jobs" | grep -Eq $'^build \\(aarch64,.*\tsuccess$' &&
                aarch64_build_allowed=true
              if [ "$x86_64_build_allowed" = false ] && [ "$aarch64_build_allowed" = false ]; then
                echo 'all architecture builds failed' >&2
                exit 1
              fi
            fi
          fi
          supports_arch() {
            declared=$(sed -n 's/^arch="\(.*\)"$/\1/p' "$2")
            [ -z "$declared" ] && return 0
            case " $declared " in
              *" !$1 "*) return 1 ;;
              *" all "*|*" noarch "*|*" $1 "*) return 0 ;;
            esac
            return 1
          }
          all_origins_for_arch() {
            for origin in $(find packages -mindepth 2 -maxdepth 2 -name APKBUILD \
              -exec dirname {} \; | sed 's#^packages/##' | sort -u); do
              supports_arch "$1" "packages/$origin/APKBUILD" || continue
              printf '%s\n' "$origin"
            done | paste -sd, -
          }
          x86_64_publish=false
          x86_64_origins=
          aarch64_publish=false
          aarch64_origins=
          if [ "$BOOTSTRAP" = true ]; then
            x86_64_origins=$(all_origins_for_arch x86_64)
            aarch64_origins=$(all_origins_for_arch aarch64)
          else
            for arch in x86_64 aarch64; do
              marker="https://angribot.github.io/apkbuilds/commits/$arch?run=$GITHUB_RUN_ID"
              deployed=$(curl --connect-timeout 15 --max-time 60 --retry 3 \
                --retry-connrefused -fsSL "$marker" || \
                curl --connect-timeout 15 --max-time 60 --retry 3 \
                  --retry-connrefused -fsSL \
                  "https://angribot.github.io/apkbuilds/commit?run=$GITHUB_RUN_ID")
              [[ "$deployed" =~ ^[0-9a-f]{40}$ ]] || {
                echo "$arch published commit marker is invalid; use bootstrap only for first publication" >&2
                exit 1
              }
              git merge-base --is-ancestor "$deployed" "$HEAD_SHA" || {
                echo "$arch published commit is not an ancestor of this release" >&2
                exit 1
              }
              changed=$(git diff --name-only --no-renames "$deployed" "$HEAD_SHA")
              if printf '%s\n' "$changed" | grep -Fxq 'keys/apkbuilds.rsa.pub'; then
                echo 'release key changes require a separate key-rotation migration' >&2
                exit 1
              fi
              arch_origins=$(printf '%s\n' "$changed" | python3 scripts/repository.py scope)
              origin_list=
              for origin in $(printf '%s\n' "$arch_origins" | jq -r '.[]'); do
                test -f "packages/$origin/APKBUILD" || {
                  echo "removing package $origin requires a repository migration" >&2
                  exit 1
                }
                previous="$RUNNER_TEMP/$arch-$origin-APKBUILD"
                if ! supports_arch "$arch" "packages/$origin/APKBUILD"; then
                  if git show "$deployed:packages/$origin/APKBUILD" > "$previous" 2>/dev/null &&
                    supports_arch "$arch" "$previous"; then
                    echo "$origin no longer supports $arch; repository migration required" >&2
                    exit 1
                  fi
                  continue
                fi
                origin_list="${origin_list:+$origin_list,}$origin"
                if git cat-file -e "$deployed:packages/$origin/APKBUILD" 2>/dev/null; then
                  git show "$deployed:packages/$origin/APKBUILD" > "$previous"
                  python3 scripts/repository.py verify-pkgrel \
                    --previous "$previous" \
                    --current "packages/$origin/APKBUILD"
                fi
              done
              case "$arch" in
                x86_64) x86_64_origins=$origin_list ;;
                aarch64) aarch64_origins=$origin_list ;;
              esac
            done
          fi
          publish=false
          if [ "$x86_64_build_allowed" = true ] && [ -n "$x86_64_origins" ]; then
            x86_64_publish=true
            publish=true
          fi
          if [ "$aarch64_build_allowed" = true ] && [ -n "$aarch64_origins" ]; then
            aarch64_publish=true
            publish=true
          fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "x86_64_publish=$x86_64_publish" >> "$GITHUB_OUTPUT"
          echo "x86_64_origins=$x86_64_origins" >> "$GITHUB_OUTPUT"
          echo "aarch64_publish=$aarch64_publish" >> "$GITHUB_OUTPUT"
          echo "aarch64_origins=$aarch64_origins" >> "$GITHUB_OUTPUT"

  build:
    needs: scope
    if: needs.scope.outputs.publish == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
            publish_output: x86_64_publish
            origins_output: x86_64_origins
          - arch: aarch64
            runner: ubuntu-24.04-arm
            publish_output: aarch64_publish
            origins_output: aarch64_origins
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.HEAD_SHA }}
          fetch-depth: 0
      - name: Build changed packages with an ephemeral key
        env:
          ORIGINS: ${{ needs.scope.outputs[matrix.origins_output] }}
          BUILD_ALLOWED: ${{ needs.scope.outputs[matrix.publish_output] }}
        run: |
          [ "$BUILD_ALLOWED" = true ] || exit 0
          mkdir -p "$RUNNER_TEMP/repository/packages/${{ matrix.arch }}" "$RUNNER_TEMP/new"
          docker run --rm \
            -e BOOTSTRAP="${{ inputs.bootstrap }}" \
            -e ORIGINS \
            -e REPOSITORY_URL="https://angribot.github.io/apkbuilds/edge/${{ matrix.arch }}" \
            -e TARGET_ARCH="${{ matrix.arch }}" \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -v "$RUNNER_TEMP/repository:/repository" \
            -v "$RUNNER_TEMP/new:/new" \
            -w /workspace \
            alpine:edge sh -euxc '
              [ -n "$ORIGINS" ] || exit 0
              sh /workspace/scripts/prepare-builder.sh /new /repository /workspace
              download() {
                curl --connect-timeout 15 --max-time 120 --retry 3 \
                  --retry-connrefused -fsSL "$1" -o "$2"
              }
              repository="/repository/packages/$TARGET_ARCH"
              previous_index=
              if [ "$BOOTSTRAP" != true ]; then
                previous_index=/tmp/previous-index.tar.gz
                cp /workspace/keys/apkbuilds.rsa.pub /etc/apk/keys/
                download "$REPOSITORY_URL/APKINDEX.tar.gz" "$previous_index"
                apk verify "$previous_index"
                set -- --index "$previous_index"
                for origin in $(printf %s "$ORIGINS" | tr , \ ); do
                  set -- "$@" --origin "$origin"
                done
                python3 /workspace/scripts/repository.py retained "$@" > /tmp/retained-packages
                while IFS= read -r package; do
                  download "$REPOSITORY_URL/$package" "$repository/$package"
                done < /tmp/retained-packages
                if [ -s /tmp/retained-packages ]; then
                  apk verify "$repository"/*.apk
                  apk index --no-warnings --quiet \
                    --output /tmp/retained-index.tar.gz \
                    --rewrite-arch "$TARGET_ARCH" \
                    "$repository"/*.apk
                  set -- --previous-index "$previous_index" \
                    --retained-index /tmp/retained-index.tar.gz
                  for origin in $(printf %s "$ORIGINS" | tr , \ ); do
                    set -- "$@" --origin "$origin"
                  done
                  python3 /workspace/scripts/repository.py verify-retained "$@"
                fi
              fi
              su builder -c "abuild-keygen -a -n"
              cp /home/builder/.config/abuild/*.rsa.pub /etc/apk/keys/
              for origin in $(printf %s "$ORIGINS" | tr , \ ); do
                su builder -c "cd /workspace/packages/$origin && REPODEST=/new abuild -r"
              done
              new_packages="/new/packages/$TARGET_ARCH"
              test -n "$(find "$new_packages" -name "*.apk" -print -quit)"
              apk verify "$new_packages"/*.apk
              apk index --no-warnings --quiet \
                --output /tmp/new-index.tar.gz \
                --rewrite-arch "$TARGET_ARCH" \
                "$new_packages"/*.apk
              set -- --built-index /tmp/new-index.tar.gz
              [ -n "$previous_index" ] && set -- --previous-index "$previous_index" "$@"
              for origin in $(printf %s "$ORIGINS" | tr , \ ); do
                set -- "$@" --origin "$origin"
              done
              python3 /workspace/scripts/repository.py replacements "$@" > /tmp/replacements
              while IFS="$(printf "\\t")" read -r package new old; do
                test "$(apk version -t "$new" "$old")" = ">" || {
                  echo "$package must increase version: $old -> $new" >&2
                  exit 1
                }
              done < /tmp/replacements
              for package in "$new_packages"/*.apk; do basename "$package"; done | sort > "$repository/new-packages.txt"
              test -s "$repository/new-packages.txt"
              while IFS= read -r package; do
                cp "$new_packages/$package" "$repository/$package"
              done < "$repository/new-packages.txt"
              apk index --no-warnings --quiet \
                --output "$repository/APKINDEX.tar.gz" \
                --rewrite-arch "$TARGET_ARCH" \
                "$repository"/*.apk
            '
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: needs.scope.outputs[matrix.publish_output] == 'true'
        with:
          name: staged-repository-${{ matrix.arch }}
          path: ${{ runner.temp }}/repository/packages/${{ matrix.arch }}/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  sign:
    needs: [scope, build]
    if: >-
      always() && needs.scope.result == 'success' &&
      needs.scope.outputs.publish == 'true' &&
      needs.build.result != 'cancelled'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
            publish_output: x86_64_publish
            origins_output: x86_64_origins
          - arch: aarch64
            runner: ubuntu-24.04-arm
            publish_output: aarch64_publish
            origins_output: aarch64_origins
    runs-on: ${{ matrix.runner }}
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.HEAD_SHA }}
      - name: Download staged repository
        id: download
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        if: needs.scope.outputs[matrix.publish_output] == 'true'
        with:
          name: staged-repository-${{ matrix.arch }}
          path: ${{ runner.temp }}/repository/${{ matrix.arch }}
      - name: Test staged packages with the repository read-only
        if: steps.download.outcome == 'success'
        run: |
          docker run --rm \
            -v "$RUNNER_TEMP/repository:/repository:ro" \
            -w /workspace \
            alpine:edge sh -euxc '
              repository="/repository/${{ matrix.arch }}"
              set -- apk add --allow-untrusted --repository "$repository"
              while IFS= read -r filename; do
                set -- "$@" "$repository/$filename"
              done < "$repository/new-packages.txt"
              "$@"
            '
      - name: Prepare isolated signer
        if: steps.download.outcome == 'success'
        run: |
          docker build --tag apkbuilds-signer - <<'EOF'
          FROM alpine:edge
          RUN apk add --no-cache abuild
          EOF
      - name: Sign repository without network access
        if: steps.download.outcome == 'success'
        env:
          ABUILD_PRIVATE_KEY: ${{ secrets.ABUILD_PRIVATE_KEY }}
        run: |
          docker run --rm --network none \
            -e ABUILD_PRIVATE_KEY \
            -e TARGET_ARCH="${{ matrix.arch }}" \
            -v "$RUNNER_TEMP/repository:/repository" \
            -v "$GITHUB_WORKSPACE/keys/apkbuilds.rsa.pub:/keys/apkbuilds.rsa.pub:ro" \
            apkbuilds-signer sh -euxc '
              umask 077
              set +x
              printf "%s\n" "$ABUILD_PRIVATE_KEY" > /tmp/apkbuilds.rsa
              unset ABUILD_PRIVATE_KEY
              set -x
              trap "rm -f /tmp/apkbuilds.rsa" EXIT
              cp /keys/apkbuilds.rsa.pub /etc/apk/keys/
              repository="/repository/$TARGET_ARCH"
              test -s "$repository/new-packages.txt"
              while IFS= read -r filename; do
                package="$repository/$filename"
                test -f "$package"
                work=$(mktemp -d)
                (
                  cd "$work"
                  abuild-gzsplit < "$package"
                  abuild-sign -q -t RSA256 \
                    -k /tmp/apkbuilds.rsa \
                    -p /keys/apkbuilds.rsa.pub \
                    control.tar.gz
                  cat control.tar.gz data.tar.gz > "$package"
                )
                rm -rf "$work"
              done < "$repository/new-packages.txt"
              cd "$repository"
              rm -f APKINDEX.tar.gz Packages.adb
              apk index --no-warnings --quiet \
                --output APKINDEX.tar.gz \
                --rewrite-arch "$TARGET_ARCH" \
                ./*.apk
              abuild-sign -q -t RSA256 \
                -k /tmp/apkbuilds.rsa \
                -p /keys/apkbuilds.rsa.pub \
                APKINDEX.tar.gz
            '
      - name: Verify signed packages without the private key
        if: steps.download.outcome == 'success'
        run: |
          docker run --rm \
            -v "$RUNNER_TEMP/repository:/repository:ro" \
            -v "$GITHUB_WORKSPACE:/workspace:ro" \
            -w /workspace \
            alpine:edge sh -euxc '
              cp keys/apkbuilds.rsa.pub /etc/apk/keys/
              repository="/repository/${{ matrix.arch }}"
              apk verify "$repository"/*.apk
              set -- apk add --repository "$repository"
              while IFS= read -r filename; do
                set -- "$@" "$repository/$filename"
              done < "$repository/new-packages.txt"
              "$@"
            '
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: steps.download.outcome == 'success'
        with:
          name: repository-${{ matrix.arch }}
          path: ${{ runner.temp }}/repository/${{ matrix.arch }}/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  publish:
    needs: [scope, sign]
    if: >-
      always() && needs.scope.result == 'success' &&
      needs.scope.outputs.publish == 'true' &&
      needs.sign.result != 'cancelled' && needs.sign.result != 'skipped'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.HEAD_SHA }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: repository-*
          path: public
      - name: Assemble and verify repository
        env:
          HEAD_SHA: ${{ env.HEAD_SHA }}
          X86_ORIGINS: ${{ needs.scope.outputs.x86_64_origins }}
          AARCH_ORIGINS: ${{ needs.scope.outputs.aarch64_origins }}
        run: |
          mkdir -p public/edge public/commits "public/status/$GITHUB_RUN_ID"
          published=false
          for arch in x86_64 aarch64; do
            if [ -d "public/repository-$arch" ]; then
              published=true
              mv "public/repository-$arch" "public/edge/$arch"
              printf '%s\n' "$HEAD_SHA" > "public/commits/$arch"
              printf '%s\n' published > "public/status/$GITHUB_RUN_ID/$arch"
              continue
            fi
            case "$arch" in
              x86_64) arch_origins=$X86_ORIGINS ;;
              aarch64) arch_origins=$AARCH_ORIGINS ;;
            esac
            marker="https://angribot.github.io/apkbuilds/commits/$arch?run=$GITHUB_RUN_ID"
            deployed=$(curl --connect-timeout 15 --max-time 60 --retry 3 \
              --retry-connrefused -fsSL "$marker" || \
              curl --connect-timeout 15 --max-time 60 --retry 3 \
                --retry-connrefused -fsSL \
                "https://angribot.github.io/apkbuilds/commit?run=$GITHUB_RUN_ID")
            [[ "$deployed" =~ ^[0-9a-f]{40}$ ]]
            mkdir "public/edge/$arch"
            repository="https://angribot.github.io/apkbuilds/edge/$arch"
            curl --connect-timeout 15 --max-time 120 --retry 3 \
              --retry-connrefused -fsSL "$repository/APKINDEX.tar.gz" \
              -o "public/edge/$arch/APKINDEX.tar.gz"
            python3 scripts/repository.py filenames \
              --index "public/edge/$arch/APKINDEX.tar.gz" |
              while IFS= read -r package; do
                curl --connect-timeout 15 --max-time 120 --retry 3 \
                  --retry-connrefused -fsSL "$repository/$package" \
                  -o "public/edge/$arch/$package"
              done
            marker_commit=$deployed
            [ -n "$arch_origins" ] || marker_commit=$HEAD_SHA
            printf '%s\n' "$marker_commit" > "public/commits/$arch"
            printf '%s\n' retained > "public/status/$GITHUB_RUN_ID/$arch"
          done
          test "$published" = true
          rm -f public/edge/x86_64/new-packages.txt public/edge/aarch64/new-packages.txt
          cp keys/apkbuilds.rsa.pub public/
          docker run --rm \
            -v "$GITHUB_WORKSPACE/public:/repository:ro" \
            -v "$GITHUB_WORKSPACE/keys/apkbuilds.rsa.pub:/etc/apk/keys/apkbuilds.rsa.pub:ro" \
            alpine:edge sh -euxc '
              for arch in x86_64 aarch64; do
                index="/repository/edge/$arch/APKINDEX.tar.gz"
                echo "Verifying $index"
                apk verify "$index"
                for package in /repository/edge/"$arch"/*.apk; do
                  echo "Verifying $package"
                  apk verify "$package"
                done
              done
            '
          test -s public/edge/x86_64/APKINDEX.tar.gz
          test -s public/edge/aarch64/APKINDEX.tar.gz
          test -n "$(find public/edge/x86_64 -name '*.apk' -print -quit)"
          test -n "$(find public/edge/aarch64 -name '*.apk' -print -quit)"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: public
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5

  test-pages:
    needs: [scope, publish]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
            origins_output: x86_64_origins
          - arch: aarch64
            runner: ubuntu-24.04-arm
            origins_output: aarch64_origins
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.HEAD_SHA }}
      - name: Test changed package exact-version installation from Pages
        run: |
          docker run --rm \
            -e ORIGINS="${{ needs.scope.outputs[matrix.origins_output] }}" \
            -e PUBLISHED_SHA="${{ env.HEAD_SHA }}" \
            -e RUN_ID="${{ github.run_id }}" \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            alpine:edge sh -euxc '
              wget -q -T 15 -t 4 https://angribot.github.io/apkbuilds/apkbuilds.rsa.pub -O /etc/apk/keys/apkbuilds.rsa.pub
              echo "https://angribot.github.io/apkbuilds/edge" >> /etc/apk/repositories
              status=
              for delay in 0 5 10 20 40 60; do
                sleep "$delay"
                status=$(wget -q -T 15 -t 4 -O- \
                  "https://angribot.github.io/apkbuilds/status/$RUN_ID/${{ matrix.arch }}" || true)
                [ "$status" = published ] || [ "$status" = retained ] && break
              done
              case "$status" in
                retained)
                  echo "${{ matrix.arch }} retained after build failure"
                  exit 0
                  ;;
                published) ;;
                *) exit 1 ;;
              esac
              published=$(wget -q -T 15 -t 4 -O- \
                "https://angribot.github.io/apkbuilds/commits/${{ matrix.arch }}?run=$RUN_ID")
              test "$published" = "$PUBLISHED_SHA"
              [ -n "$ORIGINS" ] || exit 0
              apk update
              set -- apk add
              for origin in $(printf %s "$ORIGINS" | tr , \ ); do
                apkbuild="/workspace/packages/$origin/APKBUILD"
                name=$(sed -n 's/^pkgname=//p' "$apkbuild")
                version=$(sed -n 's/^pkgver=//p' "$apkbuild")
                revision=$(sed -n 's/^pkgrel=//p' "$apkbuild")
                set -- "$@" "$name=$version-r$revision"
              done
              "$@"
            '
