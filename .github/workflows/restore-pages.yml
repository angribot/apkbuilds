name: Restore Pages repository

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: publish

jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # ARM artifact is from verified run before bad update. Delete this
      # one-time workflow after recovery.
      - name: Verify recovery artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh run view 29979428626 --json conclusion,headSha \
            --jq 'select(.conclusion == "success") | .headSha')" = \
            783f993eb45ba2b677f63b815ce6806c48a13e64
          test -n "$(gh api \
            "repos/$GITHUB_REPOSITORY/actions/runs/29979428626/artifacts" \
            --jq '.artifacts[] | select(.name == "repository-aarch64" and (.expired | not)) | .id')"

      - name: Download known-good aarch64 repository
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: repository-aarch64
          path: public/edge/aarch64
          github-token: ${{ github.token }}
          run-id: 29979428626

      - name: Download current x86_64 repository
        run: |
          mkdir -p public/edge/x86_64 public/commits
          repository=https://angribot.github.io/apkbuilds/edge/x86_64
          curl --fail --retry 3 "$repository/APKINDEX.tar.gz" \
            -o public/edge/x86_64/APKINDEX.tar.gz
          python3 scripts/repository.py filenames \
            --index public/edge/x86_64/APKINDEX.tar.gz |
            while IFS= read -r package; do
              curl --fail --retry 3 "$repository/$package" \
                -o "public/edge/x86_64/$package"
            done
          curl --fail --retry 3 \
            https://angribot.github.io/apkbuilds/commits/x86_64 \
            -o public/commits/x86_64
          grep -Eq '^[0-9a-f]{40}$' public/commits/x86_64

      - name: Set restored ARM commit marker
        run: |
          # Keep source marker at current main; repository is restored to its
          # last verified artifact until a correct ARM asset is available.
          printf '%s\n' 3efd73101f1743eab2475cdfd5ba7082b3370f57 > public/commits/aarch64

      - name: Verify restored repositories
        run: |
          rm -f public/edge/x86_64/new-packages.txt \
            public/edge/aarch64/new-packages.txt
          cp keys/apkbuilds.rsa.pub public/
          docker run --rm \
            -v "$PWD/public:/repository:ro" \
            -v "$PWD/keys/apkbuilds.rsa.pub:/etc/apk/keys/apkbuilds.rsa.pub:ro" \
            alpine:edge sh -ec '
              for arch in x86_64 aarch64; do
                index="/repository/edge/$arch/APKINDEX.tar.gz"
                test -s "$index"
                test -n "$(find "/repository/edge/$arch" -name "*.apk" -print -quit)"
                apk verify "$index"
                apk verify "/repository/edge/$arch"/*.apk
              done
            '

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: public

      - name: Deploy GitHub Pages
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
