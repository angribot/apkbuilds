name: Update packages

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

# Keep scheduled and manually dispatched writers from pushing to main together.
concurrency:
  group: update

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Check and commit eligible upstream releases
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash scripts/update-packages.sh
