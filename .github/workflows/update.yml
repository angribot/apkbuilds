name: Update packages

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

# Keep scheduled and manually dispatched writers from pushing to main together.
concurrency:
  group: update

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}
          # The dedicated deploy key is the updater's explicit bypass for
          # main's pull-request protection; GITHUB_TOKEN cannot bypass it.
          ssh-key: ${{ secrets.UPDATE_DEPLOY_KEY }}
      - name: Check and commit eligible upstream releases
        id: update
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: sh scripts/update-packages.sh packages/updaters
      - name: Recover a failed publication dispatch
        if: failure() && steps.update.outputs.publication_dispatch_failed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in 1 2 3; do
            if gh workflow run ci.yml --ref main -f full=false; then
              exit 0
            fi
            echo "CI reconciliation dispatch attempt $attempt failed" >&2
            [ "$attempt" -eq 3 ] || sleep $((attempt * 5))
          done
          echo '::error::CI reconciliation dispatch failed after 3 attempts' >&2
          exit 1
